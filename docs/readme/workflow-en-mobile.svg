<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-labelledby="title desc">
<title id="title">A workflow with human review</title>
<desc id="desc">Read, draft, review, finalize. Feedback returns to drafting.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#7b7391" stroke-width="1.6"/></marker></defs>
<rect width="600" height="900" rx="20" fill="#f7f6fa"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">
<rect x="86" y="55" width="428" height="132" rx="12" fill="#fff" stroke="#ddd9e6"/>
<text x="110" y="87" font-size="16" fill="#766785">1 · AI</text>
<text x="110" y="127" font-size="28" font-weight="600" fill="#241d34">Read materials</text>
<text x="110" y="160" font-size="17" fill="#625b70">Collect sources</text>
<path d="M300.0 195V246" fill="none" stroke="#7b7391" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="86" y="258" width="428" height="132" rx="12" fill="#fff" stroke="#ddd9e6"/>
<text x="110" y="290" font-size="16" fill="#766785">2 · AI</text>
<text x="110" y="330" font-size="28" font-weight="600" fill="#241d34">Draft a report</text>
<text x="110" y="363" font-size="17" fill="#625b70">Conclusions + evidence</text>
<path d="M300.0 398V449" fill="none" stroke="#7b7391" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="86" y="461" width="428" height="132" rx="12" fill="#ebe4fb" stroke="#9b7fd1"/>
<text x="110" y="493" font-size="16" fill="#766785">3 · Human</text>
<text x="110" y="533" font-size="28" font-weight="600" fill="#241d34">Human review</text>
<text x="110" y="566" font-size="17" fill="#625b70">Approve to continue</text>
<path d="M300.0 601V652" fill="none" stroke="#7b7391" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="86" y="664" width="428" height="132" rx="12" fill="#fff" stroke="#ddd9e6"/>
<text x="110" y="696" font-size="16" fill="#766785">4 · AI</text>
<text x="110" y="736" font-size="28" font-weight="600" fill="#241d34">Finalize</text>
<text x="110" y="769" font-size="17" fill="#625b70">Save task deliverables</text>
<path d="M80 527H40V324H75" fill="none" stroke="#8a6ab9" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
<text x="90" y="882" font-size="18" fill="#72539d">Return with feedback</text>
</g></svg>
